<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Card</title>
    <style>
      /* Hitungan: Tanpa box-sizing, lebar = 320 + 40 (padding) + 4 (border) = 364px */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background-color: #f1f3f5;
        font-family: Arial, sans-serif;
      }

      .card {
        width: 320px;
        padding: 20px;
        border: 1px solid #dee2e6;
        margin: 40px auto;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .card img {
        width: 100%;
        height: 160px;
        display: block;
        object-fit: cover;
        border-radius: 4px;
      }
      .card h3 {
        color: #212529;
        margin-bottom: 8px;
        margin-top: 15px;
      }
      .card p {
        font-size: 15px;
        color: #6c757d;
        line-height: 1.5;
      }
      .card a {
        font-size: 15px;
        color: #0056b3;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img src="../assets/images/first project.jpg" alt="Proyek" />
        <h3>Website Toko Online</h3>
        <p>
          Proyek latihan membuat halaman toko sederhana. Dibuat memakai HTML dan
          CSS.
        </p>
        <a href="#">Lihat Proyek</a>
      </div>
    </main>
    <footer style="text-align: center; margin-top: 20px">
      <a href="../index.html">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
