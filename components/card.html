<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Card</title>
    <style>
      /* Hitungan: Tanpa box-sizing, lebar = 320 + 40 (padding) + 4 (border) = 364px */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background-color: #f4f4f0;
        font-family: "Courier New", Courier, monospace;
      }

      .card {
        width: 320px;
        padding: 20px;
        border: 3px solid #000; /* Border hitam tegas */
        margin: 40px auto;
        background-color: #ffde59; /* Warna kuning cerah */
        box-shadow: 8px 8px 0px #000; /* Bayangan keras */
      }

      .card img {
        width: 100%;
        height: 160px;
        display: block;
        object-fit: cover;
        border: 2px solid #000;
      }
      .card h3 {
        color: #000;
        margin-bottom: 8px;
        font-size: 20px;
      }
      .card p {
        font-size: 15px;
        color: #222;
        line-height: 1.4;
      }

      .card a {
        display: inline-block;
        margin-top: 10px;
        font-size: 15px;
        color: white;
        background-color: #000;
        padding: 8px 12px;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img src="../assets/images/first project.jpg" alt="Proyek pertama " />
        <h3>Website Toko Online</h3>
        <p>
          Proyek latihan membuat halaman toko sederhana. Dibuat memakai HTML dan
          CSS.
        </p>
        <a href="#">Lihat Proyek</a>
      </div>
    </main>
    <footer style="text-align: center; margin-top: 20px">
      <a href="../index.html" style="color: #000; font-weight: bold"
        >Kembali ke Beranda</a
      >
    </footer>
  </body>
</html>
