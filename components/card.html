<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Card</title>
    <style>
      /* Hitungan: Tanpa box-sizing, lebar = 320 + 40 (padding) + 4 (border) = 364px */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background-color: #f0f4f8;
        font-family: Arial, sans-serif;
      }
      .card {
        width: 320px;
        padding: 20px;
        border: 2px solid #ccc;
        margin: 30px auto;
        background-color: white;
        border-radius: 10px;
      }
      .card img {
        width: 100%;
        height: 160px;
        display: block;
        object-fit: cover;
        border-radius: 5px;
      }
      .card h3 {
        color: #222;
        margin-bottom: 8px;
      }
      .card p {
        font-size: 15px;
        color: #555;
      }
      .card a {
        font-size: 15px;
        color: #d97706;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img src="../assets/images/proyek1.jpg" alt="Proyek" />
        <h3>Website Toko Online</h3>
        <p>
          Proyek latihan membuat halaman toko sederhana. Dibuat memakai HTML dan
          CSS.
        </p>
        <a href="#">Lihat Proyek</a>
      </div>
    </main>
    <footer style="text-align: center; margin-top: 20px">
      <a href="../index.html">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
