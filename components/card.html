<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Card</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background-color: #f4f7f6;
        font-family: Arial, sans-serif;
      }

      .card {
        width: 320px;
        padding: 20px;
        border: 1px solid #e2e8f0;
        margin: 40px auto;
        background-color: white;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }
      .card img {
        width: 100%;
        height: 160px;
        display: block;
        object-fit: cover;
        border-radius: 8px;
      }
      .card h3 {
        color: #2d3748;
        margin-bottom: 8px;
        margin-top: 15px;
      }
      .card p {
        font-size: 15px;
        color: #718096;
        line-height: 1.6;
      }
      .card a {
        font-size: 15px;
        color: #319795;
        text-decoration: none;
        font-weight: bold;
      }
      .card a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img src="../assets/images/first-project.jpg" alt="Proyek" />
        <h3>Website Toko Online</h3>
        <p>
          Proyek latihan membuat halaman toko sederhana. Dibuat memakai HTML dan
          CSS.
        </p>
        <a href="#">Lihat Proyek</a>
      </div>
    </main>
    <footer style="text-align: center; margin-top: 20px">
      <a href="../index.html" style="color: #319795; text-decoration: none"
        >Kembali ke Beranda</a
      >
    </footer>
  </body>
</html>
