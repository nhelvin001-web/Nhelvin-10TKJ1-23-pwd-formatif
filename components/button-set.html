<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tombol</title>
    <style>
      body {
        background-color: #f9f9f9;
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      h2 {
        color: darkblue;
        font-size: 20px;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: bold;
        text-decoration: none;
        cursor: pointer;
      }
      .button-group .btn {
        margin-right: 10px;
        margin-bottom: 10px;
      }
      .btn-primary {
        background-color: #003366;
        color: white;
      }
      .btn-secondary {
        background-color: #e0e0e0;
      }
      .btn-outline {
        background-color: white;
        border: 2px solid #003366;
      }
      .btn-send {
        background-color: rgb(200, 100, 0);
        color: white;
      }
      .btn-secondary,
      .btn-outline {
        color: #333333;
      }
      .btn-primary:hover {
        background-color: navy;
      }
      .btn-secondary:hover {
        background-color: grey;
      }
      .btn-outline:hover {
        background-color: lightgrey;
      }
      .btn-send:hover {
        background-color: rgba(150, 50, 0, 1);
      }
    </style>
  </head>
  <body>
    <main>
      <h2>Daftar Tombol</h2>
      <div class="button-group">
        <a href="#" class="btn btn-primary">Lihat Proyek</a>
        <a href="#" class="btn btn-secondary">Unduh CV</a>
        <a href="#" class="btn btn-outline">Hubungi Saya</a>
        <a href="#" class="btn btn-send">Kirim Pesan</a>
      </div>
    </main>
    <footer style="margin-top: 30px">
      <a href="../index.html">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
