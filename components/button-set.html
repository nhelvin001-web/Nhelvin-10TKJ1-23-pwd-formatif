<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tombol</title>
    <style>
      body {
        background-color: #fafafa;
        font-family: Arial, sans-serif;
        padding: 30px;
      }
      h2 {
        color: #333;
        font-size: 20px;
      }
      .btn {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 6px;
        font-weight: bold;
        text-decoration: none;
        font-size: 14px;
      }
      .button-group .btn {
        margin-right: 10px;
        margin-bottom: 10px;
      }

      .btn-primary {
        background-color: #0056b3;
        color: white;
      }
      .btn-secondary {
        background-color: #e9ecef;
        color: #333;
      }
      .btn-outline {
        background-color: white;
        border: 2px solid #0056b3;
        color: #0056b3;
      }
      .btn-send {
        background-color: #fd7e14;
        color: white;
      }

      .btn-secondary,
      .btn-outline {
        color: #333333;
      }

      .btn-primary:hover {
        background-color: #004085;
      }
      .btn-secondary:hover {
        background-color: #ced4da;
      }
      .btn-outline:hover {
        background-color: #f8f9fa;
      }
      .btn-send:hover {
        background-color: #e36a0d;
      }
    </style>
  </head>
  <body>
    <main>
      <h2>Pilihan Tombol</h2>
      <div class="button-group">
        <a href="#" class="btn btn-primary">Lihat Proyek</a>
        <a href="#" class="btn btn-secondary">Unduh CV</a>
        <a href="#" class="btn btn-outline">Hubungi Saya</a>
        <a href="#" class="btn btn-send">Kirim Pesan</a>
      </div>
    </main>
    <footer style="margin-top: 30px">
      <a href="../index.html">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
