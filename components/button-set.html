<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tombol</title>
    <style>
      body {
        background-color: #fafafa;
        font-family: "Segoe UI", Tahoma, sans-serif;
        padding: 40px;
      }
      h2 {
        color: #2c3e50;
        font-size: 20px;
        margin-bottom: 20px;
      }

      /* Tombol dibuat bulat */
      .btn {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 50px; /* fungsi nya agar mbulat */
        font-weight: bold;
        text-decoration: none;
        font-size: 14px;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .button-group .btn {
        margin-right: 10px;
        margin-bottom: 10px;
      }

      .btn-primary {
        background-color: #6c5ce7;
        color: white;
        box-shadow: 0 4px 6px rgba(108, 92, 231, 0.3);
      }
      .btn-secondary {
        background-color: #dfe6e9;
        color: #2d3436;
      }
      .btn-outline {
        background-color: transparent;
        border: 2px solid #6c5ce7;
        color: #6c5ce7;
      }
      .btn-send {
        background-color: rgb(253, 203, 110);
        color: #2d3436;
        box-shadow: 0 4px 6px rgba(253, 203, 110, 0.3);
      }

      .btn-secondary,
      .btn-outline {
        color: #2d3436;
      }

      /* Efek hover: terangkat sedikit ktika mouse menghmapiri */
      .btn-primary:hover {
        background-color: #5b4bc4;
        transform: translateY(-3px);
        box-shadow: 0 6px 8px rgba(108, 92, 231, 0.4);
      }
      .btn-secondary:hover {
        background-color: #b2bec3;
        transform: translateY(-3px);
      }
      .btn-outline:hover {
        background-color: #f1f2f6;
        transform: translateY(-3px);
      }
      .btn-send:hover {
        background-color: rgba(235, 180, 80, 1);
        transform: translateY(-3px);
      }
    </style>
  </head>
  <body>
    <main>
      <h2>Pilihan Tombol</h2>
      <div class="button-group">
        <a href="#" class="btn btn-primary">Lihat Proyek</a>
        <a href="#" class="btn btn-secondary">Unduh CV</a>
        <a href="#" class="btn btn-outline">Hubungi Saya</a>
        <a href="#" class="btn btn-send">Kirim Pesan</a>
      </div>
    </main>
    <footer style="margin-top: 40px">
      <a href="../index.html" style="color: #6c5ce7">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
