<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tombol</title>
    <style>
      body {
        background-color: #f4f7f6;
        font-family: Arial, sans-serif;
        padding: 40px;
      }
      h2 {
        color: #2d3748;
        font-size: 20px;
      }

      .btn {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: bold;
        text-decoration: none;
        font-size: 14px;
        transition: all 0.3s ease;
      }
      .button-group .btn {
        margin-right: 10px;
        margin-bottom: 10px;
      }

      .btn-primary {
        background-color: #1a3cff;
        color: white;
      }
      .btn-secondary {
        background-color: #f6f4b8;
        color: #4a5568;
      }
      .btn-outline {
        background-color: transparent;
        border: 2px solid #319795;
        color: #319795;
      }
      .btn-send {
        background-color: rgb(224, 22, 136);
        color: white;
      }

      .btn-secondary,
      .btn-outline {
        color: #2d3748;
      }

      .btn-primary:hover {
        background-color: #0f2395;
      }
      .btn-secondary:hover {
        background-color: #a4a268;
      }
      .btn-outline:hover {
        background-color: rgba(49, 151, 149, 0.1);
      }
      .btn-send:hover {
        background-color: rgb(102, 10, 62);
      }
    </style>
  </head>
  <body>
    <main>
      <h2>Pilihan Tombol</h2>
      <div class="button-group">
        <a href="#" class="btn btn-primary">Lihat Proyek</a>
        <a href="#" class="btn btn-secondary">Unduh CV</a>
        <a href="#" class="btn btn-outline">Hubungi Saya</a>
        <a href="#" class="btn btn-send">Kirim Pesan</a>
      </div>
    </main>
    <footer style="margin-top: 40px">
      <a href="../index.html" style="color: #319795; text-decoration: none"
        >Kembali ke Beranda</a
      >
    </footer>
  </body>
</html>
