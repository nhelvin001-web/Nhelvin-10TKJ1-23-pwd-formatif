<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kontak</title>
    <style>
      body {
        background-color: #f4f7f6;
        font-family: Arial, sans-serif;
      }
      #contact {
        padding: 60px 20px;
      }
      .contact-form {
        width: 400px;
        margin: 0 auto;
        padding: 30px;
        border: 1px solid #e2e8f0;
        background-color: white;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }
      .contact-form h2 {
        text-align: center;
        color: #2d3748;
        margin-top: 0;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
        color: #4a5568;
        font-size: 14px;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #cbd5e0;
        border-radius: 8px;
        font-family: inherit;
        transition: border-color 0.3s;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        border-color: #319795;
        outline: none;
        box-shadow: 0 0 0 3px rgba(49, 151, 149, 0.2);
      }

      .btn-submit {
        background-color: #319795;
        color: white;
        padding: 14px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
        transition: background 0.3s;
      }
      .btn-submit:hover {
        background-color: #2c7a7b;
      }
    </style>
  </head>
  <body>
    <section id="contact">
      <form class="contact-form">
        <h2>Hubungi Saya</h2>
        <div class="form-group">
          <label for="nama">Nama</label>
          <input type="text" id="nama" placeholder="Masukkan nama Anda" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Masukkan email Anda" />
        </div>
        <div class="form-group">
          <label for="pesan">Pesan</label>
          <textarea
            id="pesan"
            rows="4"
            placeholder="Tulis pesan Anda"
          ></textarea>
        </div>
        <button type="submit" class="btn-submit">Kirim Pesan</button>
      </form>
    </section>
    <footer style="text-align: center; margin-top: 20px">
      <a href="../index.html" style="color: #319795; text-decoration: none"
        >Kembali ke Beranda</a
      >
    </footer>
  </body>
</html>
