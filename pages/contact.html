<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kontak</title>
    <style>
      body {
        background-color: #ffffff;
        font-family: "Helvetica Neue", sans-serif;
      }
      #contact {
        padding: 60px 20px;
      }
      .contact-form {
        width: 400px;
        margin: 0 auto;
        padding: 30px;
      }
      .contact-form h2 {
        text-align: center;
        color: #333;
        font-weight: 300;
        letter-spacing: 1px;
      }
      .form-group {
        margin-bottom: 24px;
      }
      .form-group label {
        display: block;
        font-size: 14px;
        margin-bottom: 8px;
        color: #666;
        text-transform: uppercase;
      }

      /* Input hanya garis bawah */
      .form-group input,
      .form-group textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 0;
        border: none;
        border-bottom: 2px solid #ccc;
        background-color: transparent;
        font-family: inherit;
        font-size: 16px;
        transition: border-color 0.3s;
      }

      /* Focus mengubah warna garis bawah */
      .form-group input:focus,
      .form-group textarea:focus {
        border-bottom-color: #e67e22;
        outline: none;
      }

      .btn-submit {
        background-color: #e67e22;
        color: white;
        padding: 14px 24px;
        border: none;
        width: 100%;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      .btn-submit:hover {
        background-color: #d35400;
      }
    </style>
  </head>
  <body>
    <section id="contact">
      <form class="contact-form">
        <h2>Hubungi Saya</h2>
        <div class="form-group">
          <label for="nama">Nama</label>
          <input type="text" id="nama" placeholder="Masukkan nama" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Masukkan email" />
        </div>
        <div class="form-group">
          <label for="pesan">Pesan</label>
          <textarea id="pesan" rows="4" placeholder="Tulis pesan"></textarea>
        </div>
        <button type="submit" class="btn-submit">Kirim Pesan</button>
      </form>
    </section>
    <footer style="text-align: center; margin-top: 20px">
      <a href="../index.html" style="color: #666">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
