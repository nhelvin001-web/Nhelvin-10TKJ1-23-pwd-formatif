<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      .container {
        height: 100vh;
        border: 1px solid black;
        display: flex;
        flex-direction: column;
        gap: 10px;
        justify-content: end;
        align-items: end;
      }
      .item {
        width: 100px;
        height: 100px;
        border: 16px solid rgb(195, 195, 12);
        text-align: center;
        line-height: 100px;
      }
      .Giorno {
        transition: ease-out;
        background-color: antiquewhite;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item" class="Giorno">Giorno</div>
      <div class="item" class="Mistah">Mistah</div>
      <div class="item" class="Bucciarati">Bucciarati</div>
      <div class="item" class="Narancia">Narancia</div>
      <div class="item" class="Abbachio">Abbachio</div>
    </div>
  </body>
</html>
